services:
  - type: web
    name: tradeshow-api
    runtime: elixir
    rootDir: server-phoenix
    buildCommand: ./build.sh
    startCommand: _build/prod/rel/tradeshow/bin/server
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: AIRTABLE_PAT
        sync: false
      - key: BETA_ACCESS_CODE
        sync: false
